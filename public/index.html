<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bankit Transfer Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <span class="eyebrow">BANKIT</span>
        <h1>Transfer Console</h1>
        <p>Send money between Bankit accounts and inspect transfer results.</p>
      </div>
      <span id="health" class="health">Checking API…</span>
    </header>

    <section class="grid">
      <article class="card transfer-card">
        <div class="card-heading">
          <div>
            <span class="section-label">Money transfer</span>
            <h2>Send funds</h2>
          </div>
        </div>
        <form id="transfer-form">
          <label>Sender account ID<input id="senderAccountId" required placeholder="e.g. 2a9..." autocomplete="off"></label>
          <label>Recipient account ID<input id="recipientAccountId" required placeholder="e.g. 7bf..." autocomplete="off"></label>
          <div class="row">
            <label>Amount<input id="amount" type="number" min="0.01" step="0.01" required placeholder="20000"></label>
            <label>Currency<input value="Determined from account" disabled></label>
          </div>
          <label>Idempotency key <span class="muted">(recommended)</span><input id="idempotencyKey" placeholder="retry-safe-key-001" autocomplete="off"></label>
          <button type="submit" id="send-btn">Send transfer</button>
        </form>
        <div id="transfer-result" class="result hidden"></div>
      </article>

      <article class="card">
        <span class="section-label">Account</span>
        <h2>Check balance</h2>
        <form id="balance-form" class="inline-form">
          <input id="balanceAccountId" required placeholder="Account ID" autocomplete="off">
          <button type="submit">Check</button>
        </form>
        <div id="balance-result" class="result hidden"></div>

        <div class="divider"></div>
        <span class="section-label">Transfer lookup</span>
        <h2>Find a transfer</h2>
        <form id="lookup-form" class="inline-form">
          <input id="reference" required placeholder="TRX-..." autocomplete="off">
          <button type="submit">Lookup</button>
        </form>
        <div id="lookup-result" class="result hidden"></div>
      </article>
    </section>

    <section class="card history-card">
      <div class="history-top">
        <div>
          <span class="section-label">Bonus endpoint</span>
          <h2>Account transaction history</h2>
        </div>
        <form id="history-form" class="history-form">
          <input id="historyAccountId" required placeholder="Account ID" autocomplete="off">
          <input id="historyLimit" type="number" min="1" max="100" value="20">
          <button type="submit">Load history</button>
        </form>
      </div>
      <div id="history-result" class="table-wrap hidden"></div>
    </section>

    <footer>Bankit API · Express + TypeORM + MySQL</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
