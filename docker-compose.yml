services:
  mysql:
    image: mysql:8.4
    container_name: bankit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bankit
      MYSQL_USER: bankit
      MYSQL_PASSWORD: bankit
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubankit", "-pbankit"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bankit
      DB_PASSWORD: bankit
      DB_NAME: bankit
      DB_POOL_SIZE: 10
    ports:
      - "3000:3000"

volumes:
  mysql_data:
